[env:atmega328pb]
platform = atmelavr
board = atmega328pb
upload_protocol = usbtiny
board_fuses.lfuse = 0xE2  ; 8MHz internal oscillator, no CKDIV8
board_fuses.hfuse = 0xD9  ; default high fuse
board_fuses.efuse = 0xF7
board_build.mcu = atmega328pb
board_build.f_cpu = 8000000L
upload_flags = 
    -pm328pb
    -B 10
    -V
    -e