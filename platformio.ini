[env:atmega328_bare]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_protocol = usbtiny
board_fuses.lfuse = 0xE2  ; 8MHz internal oscillator, no CKDIV8
board_fuses.hfuse = 0xD9  ; default high fuse
board_fuses.efuse = 0xFF 
board_build.mcu = atmega328
board_build.f_cpu = 1000000L
upload_flags = 
    -pm328
    -B 10
    -V
    -e